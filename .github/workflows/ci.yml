name: CI

on: [push]

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  IMAGE_NAME: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/juice-shop
  APP_URL: "3.96.192.165"


jobs:
  create_cache:
    runs-on: ubuntu-latest
    container: node:18-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Restore cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies (cache miss only)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: yarn install

  yarn_test:
    runs-on: ubuntu-latest
    needs: create_cache
    container: node:18-bullseye
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - run: yarn install
      - run: yarn test

  gitleaks:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: create_cache
    container:
      image: zricethezav/gitleaks:latest
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - run: gitleaks detect --source . --verbose -f json -r gitleaks.json
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json

  njsscan:
    runs-on: ubuntu-latest
    needs: create_cache
    permissions:
      security-events: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: nodejsscan scan
        id: njsscan
        uses: ajinabraham/njsscan-action@master
        with:
          args: '. --sarif --output results.sarif --exit-warning'
      - name: Upload njsscan report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
      - name: Save njsscan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: njsscan.sarif
          path: results.sarif

  semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: create_cache
    container: semgrep/semgrep
    env:
      SEMGREP_RULES: p/javascript
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --json --output semgrep.json
      - name: Save semgrep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep.json
          path: semgrep.json 

  retire:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: create_cache
    container: node:18-bullseye
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - run: npm install -g retire
      - run: retire --path . --outputformat json --outputpath retire.json
      - name: Upload retire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retire.json
          path: retire.json 

  build_image:
    runs-on: [self-hosted, juice-shop]
    needs: [yarn_test, gitleaks, njsscan, semgrep]
    steps:
      - uses: actions/checkout@v4
      - name: Set IMAGE_NAME
        run: echo "IMAGE_NAME=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/juice-shop" >> $GITHUB_ENV
      - name: Log in to ECR
        run: aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - name: Reclaim disk space on runner
        run: |
          df -h /
          docker system prune -af
          docker builder prune -af
          df -h /
      - run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
      - run: docker push $IMAGE_NAME:${{ github.sha }}
      - run: docker push $IMAGE_NAME:latest

  trivy:
    name: Trivy Image Scan
    runs-on: [self-hosted, juice-shop]
    continue-on-error: true
    needs: build_image
    steps:
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Log in to ECR
        run: aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - name: Set IMAGE_NAME
        run: echo "IMAGE_NAME=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/juice-shop" >> $GITHUB_ENV
      - name: Run Trivy scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            -f json \
            -o trivy.json \
            $IMAGE_NAME:${{ github.sha }}
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy.json
          path: trivy.json 

  deploy_test:
    runs-on: [self-hosted, juice-shop]
    needs: build_image
    steps:
      - name: Deploy via SSM
        run: |
          IMAGE_NAME="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/juice-shop"
          LOG_IN_CMD="export AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}; aws ecr get-login-password | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          COMMAND_TO_EXECUTE="docker pull ${IMAGE_NAME}:latest && (docker stop juice-shop || true) && (docker rm juice-shop || true) && docker run -d --name juice-shop -p 3000:3000 ${IMAGE_NAME}:latest"
          COMMAND_ID=$(aws ssm send-command --instance-ids "i-060c4d2c872ce9504" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[$LOG_IN_CMD, $COMMAND_TO_EXECUTE]" \
          --query "Command.CommandId" --output text)
          sleep 15
          aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "i-060c4d2c872ce9504"
          
  zap_baseline:
    runs-on: [self-hosted, juice-shop]
    needs: deploy_test
    container:
      image: ghcr.io/zaproxy/zaproxy:stable
    env:
      ZAP_TARGET: "http://$APP_URL:3000"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ZAP workspace
        run: mkdir -p /zap/wrk
      - name: Run ZAP Baseline Scan
        run: |
          zap-baseline.py -t "$ZAP_TARGET" -g gen.conf -I -x baseline.xml
          cp /zap/wrk/baseline.xml $GITHUB_WORKSPACE/baseline.xml
      - name: Upload Baseline Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline
          path: ${{ github.workspace }}/baseline.xml

  zap_full:
    runs-on: [self-hosted, juice-shop]
    needs: deploy_test
    container:
      image: ghcr.io/zaproxy/zaproxy:stable
    env:
      ZAP_TARGET: "http://$APP_URL:3000"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ZAP workspace
        run: mkdir -p /zap/wrk
      - name: Run ZAP full Scan
        run: |
          zap-full-scan.py -t "$ZAP_TARGET" -g gen.conf -I -x zap.xml
          cp /zap/wrk/zap.xml $GITHUB_WORKSPACE/zap.xml
      - name: Upload full scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-full
          path: ${{ github.workspace }}/zap.xml        

  upload_reports:
    name: upload-reports
    runs-on: ubuntu-latest
    needs: [gitleaks, njsscan, semgrep, retire, trivy, zap_baseline, zap_full]
    if: always()
    container: python:3
    env:
     DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Download gitleaks report
        uses: actions/download-artifact@v4
        with:
         name: gitleaks-report
      - name: Download njsscan.sarif
        uses: actions/download-artifact@v4
        with:
          name: njsscan.sarif
      - run: mv results.sarif njsscan.sarif
      - name: Download semgrep.json
        uses: actions/download-artifact@v4
        with:
         name: semgrep.json
      - name: Download retire.json
        uses: actions/download-artifact@v4
        with:
         name: retire.json
      - name: Download trivy.json
        uses: actions/download-artifact@v4
        with:
         name: trivy.json
      - name: Download zap-baseline
        uses: actions/download-artifact@v4
        with:
         name: zap-baseline
      - name: Download zap-full
        uses: actions/download-artifact@v4
        with:
         name: zap-full
      - run: pip install requests
      - run: python3 upload-report.py gitleaks.json
      - run: python3 upload-report.py njsscan.sarif
      - run: python3 upload-report.py semgrep.json
      - run: python3 upload-report.py retire.json
      - run: python3 upload-report.py trivy.json
      - run: python3 upload-report.py baseline.xml 
      - run: python3 upload-report.py zap.xml     
  
  deploy_prod:
    runs-on: [self-hosted, juice-shop]
    needs: [zap_baseline]
    environment: production
    steps:
      - name: Deploy to production
        run: echo "deploying to production environment"








