name: CI

on: [push]

env:
  AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  # FIX: Evaluates variables cleanly via Context Syntax
  IMAGE_NAME: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_DEFAULT_REGION }}.amazonaws.com/juice-shop
  SERVER_IP: 18.221.101.228
  SERVER_USER: ubuntu

jobs:
  create_cache:
    runs-on: ubuntu-latest
    container: node:18-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Restore cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies (cache miss only)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: yarn install

  yarn_test:
    runs-on: ubuntu-latest
    needs: create_cache
    container: node:18-bullseye
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - run: yarn install
      - run: yarn test

  gitleaks:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: create_cache
    container:
      image: zricethezav/gitleaks:latest
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - run: gitleaks detect --source . --verbose -f json -r gitleaks.json
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json

  njsscan:
    runs-on: ubuntu-latest
    needs: create_cache
    permissions:
      security-events: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: nodejsscan scan
        id: njsscan
        uses: ajinabraham/njsscan-action@master
        with:
          args: '. --sarif --output results.sarif --exit-warning'
      - name: Upload njsscan report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
      - name: Save njsscan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: njsscan.sarif
          path: results.sarif

  semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: create_cache
    container: semgrep/semgrep
    env:
      SEMGREP_RULES: p/javascript
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --json --output semgrep.json
      - name: Save semgrep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep.json
          path: semgrep.json 

  retire:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: create_cache
    container: node:18-bullseye
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - run: npm install -g retire
      - run: retire --path . --outputformat json --outputpath retire.json
      - name: Upload retire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retire.json
          path: retire.json         

  build_image:
    runs-on: ubuntu-latest
    needs: [yarn_test, gitleaks, njsscan, semgrep]
    steps:
      - uses: actions/checkout@v4
      
      # FIX: Authenticates runner context safely with AWS before docker commands run
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy_image:
    runs-on: ubuntu-latest
    needs: [yarn_test, gitleaks, njsscan, semgrep, build_image]
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy to Server via SSH
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
            aws ecr get-login-password --region ${{ env.AWS_DEFAULT_REGION }} | docker login --username AWS --password-stdin $IMAGE_NAME || true
            docker pull $IMAGE_NAME:latest
            docker stop juice-shop || true && docker rm juice-shop || true
            docker run -d --name juice-shop -p 3000:3000 $IMAGE_NAME:latest
          "