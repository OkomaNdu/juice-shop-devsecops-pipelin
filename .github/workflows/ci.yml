name: CI

on: [push]

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  IMAGE_NAME: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/juice-shop


jobs:
  build_image:
    runs-on: [self-hosted, juice-shop]
    steps:
      - uses: actions/checkout@v4
      - name: Set IMAGE_NAME
        run: echo "IMAGE_NAME=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/juice-shop" >> $GITHUB_ENV
      - name: Log in to ECR
        run: aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
      - run: docker push $IMAGE_NAME:${{ github.sha }}
      - run: docker push $IMAGE_NAME:latest

  deploy_test:
    runs-on: [self-hosted, juice-shop]
    needs: build_image
    steps:
      - name: Deploy via SSM
        run: |
          LOG_IN_CMD="export AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}; aws ecr get-login-password | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          COMMAND_TO_EXECUTE="docker pull ${IMAGE_NAME}:latest && (docker stop juice-shop || true) && (docker rm juice-shop || true) && docker run -d --name juice-shop -p 3000:3000 ${IMAGE_NAME}:latest"
          COMMAND_ID=$(aws ssm send-command --instance-ids "i-0e4574892a8c29205" \
           --document-name "AWS-RunShellScript" \
           --parameters "commands=[$LOG_IN_CMD, $COMMANDS_TO_EXECUTE]" \
           --query "Command.CommandId" --output text)
          sleep 15
          aws ssm get-command-invocation \
           --command-id "$COMMAND_ID" \
           --instance-id "i-0e4574892a8c29205"

  zap_baseline:
    runs-on: ubuntu-latest
    needs: deploy_test
    container:
      image: owasp/zap2docker-stable
    steps:
      - name: Run ZAP Baseline Scan
        run: |
          mkdir -p /zap/wrk
          zap-baseline.py -t http://35.182.15.129:3000 -g gen.conf -I -x baseline.xml || true
          cp /zap/wrk/baseline.xml baseline.xml
      - name: Upload Baseline Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline
          path: baseline.xml






